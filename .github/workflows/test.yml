name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-unit:
    name: typecheck + unit
    runs-on: ubuntu-latest
    # tests/unit/tracker-webhook-scope.test.ts runs the tracker webhook
    # handlers against a real (migrated) Postgres to pin tenant isolation.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crumb
          POSTGRES_PASSWORD: crumb
          POSTGRES_DB: crumb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://crumb:crumb@localhost:5432/crumb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit (dashboard + widget + db + ui)
        run: |
          (cd apps/dashboard && npx tsc --noEmit)
          (cd apps/widget    && npx tsc --noEmit)
          (cd packages/db    && npx tsc --noEmit)
          (cd packages/ui    && npx tsc --noEmit)
      - name: vitest
        run: |
          pnpm db:migrate
          pnpm --filter dashboard test

  # Compile BOTH editions so a broken cloud-lib stub, a missing ee/ overlay
  # file, or a webpack-alias regression fails the PR rather than only the
  # edition someone happened to build locally.
  build-editions:
    name: build (community + cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build community (strips ee/ overlay, stubs cloud SDKs)
        run: pnpm --filter dashboard build:community
      - name: build cloud (applies ee/ overlay, real cloud SDKs)
        run: pnpm --filter dashboard build:cloud

  # E2E gated behind a `run-e2e` PR label until the suite stabilizes.
  # Spins up a fresh Postgres + applies migrations + seeds + boots the
  # dashboard, then runs Playwright. Slow (~3-5 min); off the critical
  # PR path on purpose.
  e2e:
    name: e2e (label-gated)
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled: the schema now has a vector(1024) column + HNSW
        # index, applied by the migrations (CREATE EXTENSION vector). Plain
        # postgres:16 + db:push can't create it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crumb
          POSTGRES_PASSWORD: crumb
          POSTGRES_DB: crumb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://crumb:crumb@localhost:5432/crumb
      # Inbound + webhook specs need these on the server.
      CRUMB_INBOUND_SECRET: e2e-inbound
      CRUMB_INBOUND_DOMAIN: crumb.test
      CRUMB_WEBHOOK_ALLOW_ANY: "1"
      SLACK_SIGNING_SECRET: e2e-slack-signing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apply migrations + seed
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: install Playwright browsers
        run: pnpm --filter dashboard exec playwright install --with-deps chromium
      - name: build + start dashboard
        run: |
          pnpm --filter dashboard build:cloud
          pnpm --filter dashboard start &
          npx wait-on http://localhost:3000 -t 120000
      - name: run e2e (self_host)
        run: pnpm --filter dashboard test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
          retention-days: 7

  # AI features are Cloud-only + call the external model — this job runs them at
  # CRUMB_TIER=cloud against the deterministic AI stub (the playwright.ai config
  # boots both the stub and the dev server with the right env). Separate job so
  # it doesn't collide with the self_host server on :3000.
  e2e-ai:
    name: e2e AI (label-gated)
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crumb
          POSTGRES_PASSWORD: crumb
          POSTGRES_DB: crumb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://crumb:crumb@localhost:5432/crumb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apply migrations + seed
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: install Playwright browsers
        run: pnpm --filter dashboard exec playwright install --with-deps chromium
      - name: run e2e (AI, cloud tier + stub)
        run: pnpm --filter dashboard test:e2e:ai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ai
          path: apps/dashboard/playwright-report
          retention-days: 7
