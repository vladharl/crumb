name: secrets-scan

# Scan the FULL git history for committed secrets (API keys, tokens, private
# keys) on every PR and every push to main. crumb is a public repo, so a
# credential committed in ANY commit — even one later deleted — stays exposed
# in history; this gate catches it before it merges. Known-benign test fixtures
# and *.env*.example placeholders are allowlisted in .gitleaks.toml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — scan every commit, not just the tip

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version

      # `gitleaks git` walks every commit and exits non-zero if any unallowed
      # secret is found, failing the job. --redact keeps the secret value out
      # of the public Actions log.
      - name: Scan git history
        run: /tmp/gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner
