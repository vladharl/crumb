name: release

# Builds and publishes the COMMUNITY (self-host) dashboard image to GHCR on a
# version tag. This is the artifact self-hosters pull. The cloud image is built
# from the same Dockerfile with `--build-arg CRUMB_EDITION=cloud` in a separate
# private pipeline — it is intentionally not published here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  community-image:
    name: community image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/crumb-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build + push community image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          build-args: |
            CRUMB_EDITION=community
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
